services:
  postgres:
    image: postgres:17-alpine
    container_name: stayprimeph-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: stayprimeph
      POSTGRES_USER: stayprimeph
      POSTGRES_PASSWORD: stayprimeph
    ports:
      - "5432:5432"
    volumes:
      - stayprimeph_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stayprimeph -d stayprimeph"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  stayprimeph_postgres_data:
